<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Countly</title>
<style>
:root{
  --bg:#000;
  --s1:#0f0f12;      /* card */
  --s2:#17171c;      /* raised */
  --s3:#202027;      /* chips/inputs */
  --text:#e9e7ef;
  --muted:#9b99a6;
  --primary:#8ecbff; --on-primary:#00344f; --primary-c:#004b71; --on-c:#cde8ff; --hero2:#00192b;
  --ok:#30E88D; --warn:#FFB524; --bad:#FF4D5E; --exp:#FF2E93;
  --r-xl:32px; --r-lg:24px; --r-md:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Roboto,"Google Sans",system-ui,sans-serif}
body{min-height:100vh;padding-bottom:210px;overscroll-behavior:none}
svg{width:24px;height:24px;fill:currentColor;flex:none}

/* top app bar */
.bar{position:sticky;top:0;z-index:5;padding:max(14px,env(safe-area-inset-top)) 20px 8px;background:#000}
.bar{display:flex;align-items:flex-end;justify-content:space-between}
.pal{width:48px;height:48px;border-radius:16px;border:0;background:var(--s2);color:var(--primary);display:grid;place-items:center}
.pal:active{transform:scale(.94)}
.themes{display:grid;grid-template-columns:repeat(5,1fr);gap:14px 8px;margin-bottom:20px}
.sw{background:none;border:0;color:var(--muted);font:12px inherit;font-family:inherit;display:grid;justify-items:center;gap:6px;padding:0}
.sw i{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;border:2px solid transparent;position:relative;overflow:hidden}
.sw i::after{content:"";position:absolute;right:0;bottom:0;width:26px;height:26px;border-radius:26px 0 0 0;background:var(--b)}
.sw.on i{border-color:var(--text)}
.sw.on{color:var(--text)}
.sw svg{width:22px;height:22px;position:relative;z-index:1;color:#000}
.bar small{color:var(--muted);font-size:14px;letter-spacing:.3px}
.bar h1{margin:2px 0 0;font-size:34px;font-weight:500;letter-spacing:-.5px}

/* hero */
.hero{margin:8px 16px 0;border-radius:var(--r-xl);padding:22px;background:linear-gradient(145deg,var(--primary-c),var(--hero2) 75%);display:flex;align-items:center;gap:20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:#ffffff0d}
.hero .t{flex:1;min-width:0;z-index:1}
.hero .lbl{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--on-c);opacity:.8}
.hero .nm{font-size:22px;font-weight:500;margin:4px 0 2px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;overflow-wrap:anywhere;line-height:1.2}
.hero .sb{font-size:13px;opacity:.75}
.ring{position:relative;width:104px;height:104px;flex:none;z-index:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .tr{stroke:#ffffff22}
.ring .pg{transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring b{font-size:28px;font-weight:600;line-height:1}
.ring span{font-size:11px;opacity:.7;margin-top:2px}

/* filter chips */
.chips{display:flex;gap:8px;padding:18px 16px 6px;overflow-x:auto;scrollbar-width:none}
.chip{border:1px solid #3a3944;background:none;color:var(--text);border-radius:12px;padding:8px 16px;font-size:14px;font-family:inherit;white-space:nowrap}
.chip.on{background:var(--primary-c);border-color:transparent;color:var(--on-c)}

/* list cards */
#list{padding:8px 16px;display:grid;gap:10px}
.card{display:flex;align-items:center;gap:16px;background:var(--s1);border-radius:var(--r-lg);padding:16px;position:relative;overflow:hidden;cursor:pointer}
.card:active{transform:scale(.985);transition:transform .1s}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.card .ic{width:48px;height:48px;border-radius:16px;display:grid;place-items:center}
.card .info{flex:1;min-width:0}
.card .nm{font-size:17px;font-weight:500}
.card .dt{font-size:13px;color:var(--muted);margin-top:2px}
.pill{display:inline-block;margin-top:8px;font-size:12px;padding:3px 10px;border-radius:8px;font-weight:500}
.st-ok .pill{background:#30E88D22;color:var(--ok)}
.st-warn .pill{background:#FFB52422;color:var(--warn)}
.st-bad .pill{background:#FF4D5E22;color:var(--bad)}
.mini{position:relative;width:68px;height:68px;flex:none}
.mini svg{width:100%;height:100%;transform:rotate(-90deg)}
.mini circle{fill:none;stroke-width:6;stroke-linecap:round}
.mini .tr{stroke:var(--s3)}
.st-ok .pg{stroke:var(--ok)}.st-warn .pg{stroke:var(--warn)}.st-bad .pg{stroke:var(--bad)}
.mini .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.mini b{font-size:19px;font-weight:600;line-height:1}
.mini span{font-size:10px;color:var(--muted);margin-top:1px}


.empty{text-align:center;color:var(--muted);padding:60px 30px}
.empty .big{width:96px;height:96px;margin:0 auto 18px;border-radius:32px;background:var(--s1);display:grid;place-items:center;color:var(--primary)}
.empty .big svg{width:44px;height:44px}
.empty h3{color:var(--text);font-weight:500;margin:0 0 6px;font-size:20px}

/* FAB */
.fab{position:fixed;right:20px;bottom:calc(98px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;height:60px;padding:0 24px 0 18px;border:0;border-radius:20px;background:var(--primary);color:var(--on-primary);font:500 16px inherit;font-family:inherit;box-shadow:0 8px 28px #0009;box-shadow:0 8px 28px color-mix(in srgb,var(--primary) 22%,transparent);z-index:6}
.fab:active{transform:scale(.96)}

/* bottom sheet */
.scrim{position:fixed;inset:0;background:#000b;opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--s2);border-radius:32px 32px 0 0;padding:12px 22px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.25,1);max-height:92vh;overflow:auto}
.sheet.on{transform:none}
.grab{width:36px;height:4px;border-radius:2px;background:#55535f;margin:0 auto 16px}
.sheet h2{margin:0 0 14px;font-size:24px;font-weight:500}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.presets .chip{background:var(--s3);border:0;font-size:13px;padding:8px 14px}
.presets .chip.on{background:var(--primary-c)}
.field{position:relative;margin-bottom:16px}
.field input{width:100%;height:58px;padding:22px 16px 6px;border-radius:16px;border:1.5px solid #3a3944;background:none;color:var(--text);font:16px inherit;font-family:inherit;outline:none;color-scheme:dark}
.field input:focus{border-color:var(--primary)}
.field label{position:absolute;left:17px;top:6px;font-size:12px;color:var(--muted);pointer-events:none}
.field input:focus+label{color:var(--primary)}
.seg-l{font-size:13px;color:var(--muted);margin:4px 0 8px}
.seg{display:flex;background:var(--s3);border-radius:16px;padding:4px;margin-bottom:22px}
.seg button{flex:1;border:0;background:none;color:var(--muted);padding:11px 0;border-radius:12px;font:500 14px inherit;font-family:inherit}
.seg button.on{background:var(--primary-c);color:var(--on-c)}
.acts{display:flex;gap:10px}
.btn{flex:1;height:52px;border:0;border-radius:18px;font:500 16px inherit;font-family:inherit}
.btn.p{background:var(--primary);color:var(--on-primary)}
.btn.t{background:var(--s3);color:var(--text)}
.btn.d{flex:none;width:52px;background:#FF4D5E22;color:var(--bad);display:grid;place-items:center}

/* snackbar */
.snack{position:fixed;left:16px;right:16px;bottom:calc(172px + env(safe-area-inset-bottom));z-index:20;background:#2d2c35;border-radius:16px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;transform:translateY(calc(100% + 160px));opacity:0;transition:transform .3s,opacity .3s;font-size:14px}
.snack.on{transform:none;opacity:1}
.snack button{background:none;border:0;color:var(--primary);font:500 14px inherit;font-family:inherit;padding:6px 8px}

/* ---------- motion ---------- */
.card.enter{animation:in .5s cubic-bezier(.2,.9,.3,1) both}
.hero.enter{animation:pop .65s cubic-bezier(.2,.9,.3,1.08) both}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(10px)}}
.mini .pg{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.ring .pg{transition:stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1)}
.st-bad .ic{animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #FF4D5E55}70%,100%{box-shadow:0 0 0 14px #FF4D5E00}}
.hero::after{animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(-26px,22px) scale(1.15)}}
.fab{animation:fabin .6s .35s cubic-bezier(.2,1.2,.3,1) both;overflow:hidden;transition:padding .3s,gap .3s,background-color .35s,color .35s,transform .15s}
@keyframes fabin{from{transform:scale(0) rotate(-90deg)}}
.fab span{max-width:60px;overflow:hidden;transition:max-width .3s,opacity .2s}
.fab.min span{max-width:0;opacity:0}
.fab.min{padding:0 18px;gap:0}
.hero,.chip,.btn,.seg button,.pill,.pal,.sw i{transition:background-color .35s,color .35s,border-color .35s,transform .15s}
.btn,.chip,.pal,.seg button{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.22;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
.chip:active,.btn:active,.sw:active i{transform:scale(.95)}
.snack{transition:transform .4s cubic-bezier(.2,1.1,.3,1),opacity .3s}
.sw.on i{animation:sel .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes sel{from{transform:scale(.8)}}
/* ---------- navigation ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;background:#0a0a0d;padding:10px 12px calc(12px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0;box-shadow:0 -1px 0 #ffffff0d}
.nav button{flex:1;background:none;border:0;color:var(--muted);font:500 12px inherit;font-family:inherit;display:grid;justify-items:center;gap:4px;padding:0}
.nav i{width:64px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background-color .3s,color .3s,width .3s}
.nav button.on{color:var(--text)}
.nav button.on i{background:var(--primary-c);color:var(--on-c)}
.nav button:active i{transform:scale(.92)}

/* ---------- dashboard ---------- */
#vDash{padding:6px 16px;display:grid;gap:12px}
.panel{background:var(--s1);border-radius:var(--r-xl);padding:20px}
.panel h3{margin:0;font-size:17px;font-weight:500}
.panel .sub{color:var(--muted);font-size:13px;margin:2px 0 14px}
.healthrow{display:flex;align-items:center;gap:20px}
.don{position:relative;width:148px;height:148px;flex:none}
.don svg{width:100%;height:100%;transform:rotate(-90deg)}
.don circle{fill:none;stroke-width:11}
.don .tr{stroke:var(--s3)}
.don .sg{transition:stroke-dasharray 1.2s cubic-bezier(.2,.8,.2,1)}
.don .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.don .c div{font-size:38px;font-weight:600;line-height:1}
.don .c div em{font-size:18px;font-style:normal;color:var(--muted)}
.don .c span{font-size:12px;color:var(--muted);margin-top:4px}
.legend{flex:1;display:grid;gap:10px}
.legend div{display:flex;align-items:center;gap:10px;font-size:14px}
.legend i{width:12px;height:12px;border-radius:4px;flex:none}
.legend b{margin-left:auto;font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--s1);border-radius:var(--r-lg);padding:16px;display:grid;gap:2px}
.tile .ti{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;margin-bottom:10px;position:relative;isolation:isolate}
.tile .ti::before,.urow .pill::before{content:"";position:absolute;inset:0;border-radius:inherit;background:currentColor;opacity:.17;z-index:-1}
.tile .ti svg{width:22px;height:22px}
.urow .pill{position:relative;isolation:isolate}
.nm,.dt,.urow .info{unicode-bidi:plaintext}
.tile b{font-size:32px;font-weight:600;line-height:1.1}
.tile span{font-size:13px;color:var(--muted)}
.tile b .num{font-size:inherit;color:var(--text)}
.chart{display:flex;align-items:flex-end;gap:5px;height:150px}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
.col .cnt{font-size:11px;color:var(--muted);height:14px;line-height:14px}
.col .b2{width:100%;border-radius:8px 8px 4px 4px;background:var(--s3);transform-origin:bottom;min-height:5px}
.col.has .b2{background:var(--primary)}
.col.od.has .b2{background:var(--bad)}
.col.now .mo{color:var(--text);font-weight:600}
.col .mo{font-size:11px;color:var(--muted)}
.panel.enter .b2{animation:grow .9s cubic-bezier(.2,.9,.3,1) both;animation-delay:var(--d)}
@keyframes grow{from{transform:scaleY(0)}}
.urow{display:flex;align-items:center;gap:14px;padding:10px 0;cursor:pointer}
.urow+.urow{border-top:1px solid #ffffff0f}
.urow .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center}
.urow .ic svg{width:22px;height:22px}
.urow .info{flex:1;min-width:0}
.urow .nm{font-size:16px;font-weight:500}
.urow .dt{font-size:12px;color:var(--muted)}
.urow .pill{margin:0;font-size:13px;padding:5px 12px}
.insights div{display:flex;justify-content:space-between;gap:12px;padding:11px 0;font-size:14px}
.insights div+div{border-top:1px solid #ffffff0f}
.insights span{color:var(--muted)}
.insights b{font-weight:500;text-align:right}
.tile.enter,.panel.enter,.urow.enter{animation:in .55s cubic-bezier(.2,.9,.3,1) both}
.card .nm,.urow .nm{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.urow .nm{-webkit-line-clamp:1;line-clamp:1}
.chip{min-height:40px}
.presets .chip{min-height:40px;padding:0 14px}
/* tablets / foldables / landscape: keep a centred phone-width column */
body>.bar,#vDash,#vDocs,.nav,.sheet{max-width:640px;margin-left:auto;margin-right:auto}
.sheet{left:0;right:0}
.fab{right:max(20px,calc(50% - 300px))}
/* category icons */
.card .ic,.urow .ic{position:relative;isolation:isolate;background:none}
.card .ic::before,.urow .ic::before,.cats button i::before{content:"";position:absolute;inset:0;border-radius:inherit;background:currentColor;opacity:.18;z-index:-1}
.card{border:1px solid #ffffff0d}
.cats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px 4px;margin-bottom:18px}
.cats button{background:none;border:0;color:var(--muted);font:10.5px inherit;font-family:inherit;display:grid;justify-items:center;gap:5px;padding:0;min-width:0}
.cats button i{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;position:relative;isolation:isolate;border:2px solid transparent;transition:transform .15s,border-color .2s}
.cats button i svg{width:23px;height:23px}
.cats button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cats button.on{color:var(--text)}
.cats button.on i{border-color:currentColor}
.cats button:active i{transform:scale(.92)}
.set-l{font-size:13px;color:var(--muted);margin:2px 0 8px}
.bk{display:flex;gap:10px;margin-bottom:10px}
.bk .btn{height:46px;font-size:14px}
#bkText{width:100%;min-height:90px;border-radius:16px;border:1.5px solid #3a3944;background:none;color:var(--text);font:12px monospace;padding:12px;margin-bottom:10px;display:none;resize:vertical}
.themes{grid-template-columns:repeat(4,1fr)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bar"><div><small id="today"></small><h1 id="title">Dashboard</h1></div>
<button class="pal" id="palBtn" aria-label="Theme"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 000 18c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.3-.5-.8-.5-1.2 0-1.1.9-2 2-2h2.3c3 0 5.2-2.2 5.2-5.2C22 6.2 17.5 3 12 3zM6.5 12a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm3-4a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm5 0a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm3 4a1.5 1.5 0 110-3 1.5 1.5 0 010 3z"/></svg></button></div>
<section id="vDash"></section>
<section id="vDocs" style="display:none">
<div id="heroWrap"></div>
<div class="chips" id="filters"></div>
<div id="list"></div>
</section>

<nav class="nav" id="nav">
  <button data-v="dash" class="on"><i><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg></i>Dashboard</button>
  <button data-v="docs"><i><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6zm-1 7V3.5L18.5 9H13zM8 13h8v2H8v-2zm0 4h8v2H8v-2z"/></svg></i>Documents</button>
</nav>

<button class="fab" id="add"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg><span>Add</span></button>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <h2 id="stitle">New document</h2>
  <div class="presets" id="presets"></div>
  <div class="seg-l">Category</div>
  <div class="cats" id="cats"></div>
  <div class="field"><input id="name" placeholder=" " autocomplete="off"><label>Name</label></div>
  <div class="field"><input id="date" type="date"><label>Expiry date</label></div>
  <div class="seg-l">Warn me when less than</div>
  <div class="seg" id="seg"></div>
  <div class="acts">
    <button class="btn d" id="del" aria-label="Delete"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button>
    <button class="btn t" id="cancel">Cancel</button>
    <button class="btn p" id="save">Save</button>
  </div>
</div>
<div class="sheet" id="tsheet">
  <div class="grab"></div>
  <h2>Theme</h2>
  <div class="themes" id="themes"></div>
  <div class="set-l">Show overdue time in</div>
  <div class="seg" id="oseg" style="margin-bottom:16px"></div>
  <div class="set-l">Backup your documents</div>
  <textarea id="bkText" placeholder="Paste a backup, or one document per line like:&#10;Iqama, 2027-03-10&#10;Passport, 2030-01-15&#10;then tap Restore"></textarea>
  <div class="bk"><button class="btn t" id="bkCopy">Copy backup</button><button class="btn t" id="bkRestore">Restore</button></div>
  <button class="btn t" style="width:100%;margin-bottom:10px" id="wbtn">Add home-screen widget</button>
  <button class="btn p" style="width:100%" id="tdone">Done</button>
</div>
<div class="snack" id="snack"><span id="smsg"></span><button id="undo">Undo</button></div>

<script>
const KEY='docs-v2';
let docs=[];try{docs=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
if(!Array.isArray(docs))docs=[];
docs=docs.filter(d=>d&&typeof d.name==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d.date||'')).map(d=>({id:String(d.id||Math.random()),name:d.name,date:d.date,warn:String(d.warn||90),cat:typeof d.cat==='string'?d.cat:''}));
let editing=null,filter='all',warnSel=90,catSel='',lastDel=null,snackT;
const $=id=>document.getElementById(id);
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(docs))}catch(e){}};
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const daysLeft=s=>Math.round((parse(s)-today())/864e5);
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const state=(n,w)=>n<0?'bad':n<=30?'bad':n<=w?'warn':'ok';
const pillText=(n)=>n<0?'Expired':n<=30?'Expiring soon':n<=90?'Renew soon':'Valid';
function breakdown(s){
  let a=today(),b=parse(s);if(b<a)[a,b]=[b,a];
  const addM=(x,k)=>{const r=new Date(x.getFullYear(),x.getMonth()+k,1);r.setDate(Math.min(x.getDate(),new Date(r.getFullYear(),r.getMonth()+1,0).getDate()));return r};
  let months=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();
  if(addM(a,months)>b)months--;
  const d=Math.round((b-addM(a,months))/864e5),y=Math.floor(months/12),m=months%12;
  const p=[];if(y)p.push(y+(y>1?' years':' year'));if(m)p.push(m+(m>1?' months':' month'));if(d||!p.length)p.push(d+(d===1?' day':' days'));return p.join(', ');
}
/* "days over" display: days / months / years / auto — user setting */
let overUnit='days';try{overUnit=localStorage.getItem('overUnit')||'days'}catch(e){}
function overInfo(date){
  const a=parse(date),b=today();
  let m=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();if(b.getDate()<a.getDate())m--;
  m=Math.max(0,m);const days=Math.max(0,Math.round((b-a)/864e5)),y=Math.floor(m/12);
  let u=overUnit;
  if(u==='auto')u=y>=1?'years':m>=1?'months':'days';
  if(u==='years'&&y<1)u=m>=1?'months':'days';
  if(u==='months'&&m<1)u='days';
  const n=u==='years'?y:u==='months'?m:days;
  return {n,u,long:n===1?u.slice(0,-1)+' over':u+' over',short:(u==='days'?'d':u==='months'?'mo':'yr')+' over'};
}
const CIRC=2*Math.PI*45;
let ANIM=true;
function ring(pct,cls){const t=CIRC*(1-pct);return '<svg viewBox="0 0 100 100"><circle class="tr" cx="50" cy="50" r="45"/><circle class="pg '+cls+'" cx="50" cy="50" r="45" stroke-dasharray="'+CIRC+'" stroke-dashoffset="'+(ANIM?CIRC:t)+'" data-t="'+t+'"/></svg>'}

function render(anim=true){ANIM=anim;draw();post()}
/* push data to the Android home-screen widget (only exists inside the installed app) */
function syncWidget(){
  try{
    const p=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.WidgetBridge;if(!p)return;
    const t=THEMES.find(x=>x[0]===theme)||THEMES[0];
    p.update({json:JSON.stringify({primary:t[2],cont:t[4],overUnit:overUnit,docs:docs.map(d=>{const c=catOfDoc(d);return {name:d.name,date:d.date,warn:+d.warn||90,ic:ICONS[c[3]],cc:c[2]}})})}).catch(()=>{});
  }catch(e){}
}
function post(){
  syncWidget();
  renderDash();
  const ps=document.querySelectorAll('.pg[data-t]');
  if(ANIM){
    document.querySelectorAll('.hero,.card,.tile,.panel,.urow').forEach(e=>e.classList.add('enter'));
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      ps.forEach(p=>p.style.strokeDashoffset=p.dataset.t);
      document.querySelectorAll('.sg[data-d]').forEach(s=>s.style.strokeDasharray=s.dataset.d);
    }));
  }
  document.querySelectorAll('.num').forEach(el=>{
    const n=+el.dataset.n;
    if(!ANIM||!n){el.textContent=n;return}
    const t0=performance.now()+250;el.textContent=0;
    const step=t=>{const k=Math.max(0,Math.min(1,(t-t0)/1000));el.textContent=Math.round(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  });
}

function draw(){
  $('today').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
  docs.sort((a,b)=>parse(a.date)-parse(b.date));

  // hero = nearest upcoming (or most overdue)
  const h=docs[0];
  if(h){
    const n=daysLeft(h.date),st=state(n,+h.warn);
    const col=st==='ok'?'var(--ok)':st==='warn'?'var(--warn)':'var(--bad)';
    $('heroWrap').innerHTML='<div class="hero"><div class="t"><div class="lbl">'+(n<0?'Needs attention':'Next to expire')+'</div><div class="nm">'+esc(h.name)+'</div><div class="sb">'+(n<0?'Expired '+breakdown(h.date)+' ago':breakdown(h.date)+' left')+'</div></div>'
      +'<div class="ring">'+ring(Math.max(.03,Math.min(1,n/365)),'')+'<div class="c">'+(n<0?(o=>'<b class="num" data-n="'+o.n+'">'+o.n+'</b><span>'+o.long+'</span>')(overInfo(h.date)):'<b class="num" data-n="'+n+'">'+n+'</b><span>days left</span>')+'</div></div></div>';
    $('heroWrap').querySelector('.pg').style.stroke=col;
  } else $('heroWrap').innerHTML='';

  const counts={all:docs.length,soon:docs.filter(d=>daysLeft(d.date)>=0&&daysLeft(d.date)<=+d.warn).length,exp:docs.filter(d=>daysLeft(d.date)<0).length};
  $('filters').innerHTML=[['all','All'],['soon','Expiring'],['exp','Expired']].map(([k,l])=>'<button class="chip '+(filter===k?'on':'')+'" data-f="'+k+'">'+l+(counts[k]?' · '+counts[k]:'')+'</button>').join('');
  $('filters').style.display=docs.length?'flex':'none';

  const shown=docs.filter(d=>{const n=daysLeft(d.date);return filter==='all'||(filter==='soon'&&n>=0&&n<=+d.warn)||(filter==='exp'&&n<0)});
  if(!docs.length){
    $('list').innerHTML='<div class="empty"><div class="big">'+svg('doc')+'</div><h3>Nothing tracked yet</h3>Add your Iqama, Visa, Passport and more — I\'ll count the days for you.</div>';return}
  if(!shown.length){$('list').innerHTML='<div class="empty"><h3>Nothing here</h3>No documents match this filter.</div>';return}
  $('list').innerHTML=shown.map((d,i)=>{
    const n=daysLeft(d.date),st=state(n,+d.warn),ct=catOfDoc(d);
    return '<div class="card st-'+st+'" data-id="'+d.id+'" style="animation-delay:'+(i*50)+'ms">'
     +'<div class="ic" style="color:'+ct[2]+'">'+svg(ct[3])+'</div>'
     +'<div class="info"><div class="nm">'+esc(d.name)+'</div><div class="dt">'+fmt(d.date)+'</div><span class="pill">'+pillText(n)+'</span></div>'
     +'<div class="mini">'+ring(Math.max(.03,Math.min(1,n/365)),'')+'<div class="c">'+(n<0?(o=>'<b class="num" data-n="'+o.n+'">'+o.n+'</b><span>'+o.short+'</span>')(overInfo(d.date)):'<b class="num" data-n="'+n+'">'+n+'</b><span>days</span>')+'</div></div></div>';
  }).join('');
}

/* sheets: the Android Back button closes an open sheet instead of leaving the app */
let sheetOn=false;
function showSheet(id){
  $('scrim').classList.add('on');$(id).classList.add('on');
  if(!sheetOn){sheetOn=true;try{history.pushState({s:1},'')}catch(e){}}
}
function hideSheets(){$('scrim').classList.remove('on');$('sheet').classList.remove('on');$('tsheet').classList.remove('on')}

  hideSheets();
  if(sheetOn){sheetOn=false;try{if(history.state&&history.state.s)history.back()}catch(e){}}
}

function openSheet(d){
  editing=d?d.id:null;$('stitle').textContent=d?'Edit document':'New document';
  $('name').value=d?d.name:'';$('date').value=d?d.date:'';warnSel=d?+d.warn:90;catSel=d?(d.cat||catOfDoc(d)[0]):'';seg();drawCats();

  try{

$('seg').onclick=e=>{const b=e.target.closest('button');if(b){warnSel=+b.dataset.w;seg()}};
$('filters').onclick=e=>{const b=e.target.closest('.chip');if(b){filter=b.dataset.f;render()}};
$('list').onclick=e=>{const c=e.target.closest('.card');if(c)openSheet(docs.find(d=>d.id===c.dataset.id))};
$('save').onclick=()=>{
  const name=$('name').value.trim(),date=$('date').value;
  if(!name||!date){snack('Enter a name and an expiry date',false);return}
  const yr=+date.slice(0,4);if(!(yr>=2000&&yr<=2100)){snack('Check the year (2000–2100)',false);return}
  const o={id:editing||String(Date.now()),name,date,warn:String(warnSel),cat:catSel};
  docs=editing?docs.map(d=>d.id===editing?o:d):[...docs,o];
  persist();closeSheet();render();
};
$('del').onclick=()=>{
  lastDel=docs.find(d=>d.id===editing);docs=docs.filter(d=>d.id!==editing);
  persist();closeSheet();render();snack('Deleted "'+lastDel.name+'"',true);
};
$('undo').onclick=()=>{if(lastDel){docs.push(lastDel);lastDel=null;persist();render();$('snack').classList.remove('on')}};
['Passport','Iqama','Visa','Driving license','Insurance','Exit/Re-entry'].forEach(n=>{
  const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{$('name').value=n;const c=PRESETCAT[n];if(c){catSel=c;drawCats()}};$('presets').appendChild(b)});
const PRESETCAT={'Passport':'passport','Iqama':'id','Visa':'visa','Driving license':'license','Insurance':'insurance','Exit/Re-entry':'visa'};
$('cats').onclick=e=>{const b=e.target.closest('button');if(b){catSel=catSel===b.dataset.c?'':b.dataset.c;drawCats()}};

/* ---------- dashboard ---------- */

const CAT=[['ok','Valid','var(--ok)'],['warn','Renew soon','var(--warn)'],['soon','Expiring ≤30d','var(--bad)'],['exp','Expired','var(--exp)']];
const catOf=d=>{const n=daysLeft(d.date);return n<0?'exp':n<=30?'soon':n<=+d.warn?'warn':'ok'};
function donut(parts,total){
  let off=0;const live=parts.filter(p=>p.v);
  return '<svg viewBox="0 0 100 100"><circle class="tr" cx="50" cy="50" r="45"/>'+live.map(p=>{
    const len=CIRC*p.v/total,seg=Math.max(.5,len-(live.length>1?4:0));
    const s='<circle class="sg" cx="50" cy="50" r="45" style="stroke:'+p.c+'" stroke-dasharray="'+(ANIM?'0 '+CIRC:seg+' '+CIRC)+'" data-d="'+seg+' '+CIRC+'" stroke-dashoffset="'+(-off)+'"/>';
    off+=len;return s}).join('')+'</svg>';
}
function renderDash(){
  const el=$('vDash');
  if(!docs.length){el.innerHTML='<div class="empty"><div class="big">'+svg('doc')+'</div><h3>No data yet</h3>Add your first document and your analytics will appear here.</div>';return}
  const list=[...docs].sort((a,b)=>parse(a.date)-parse(b.date));
  const ns=list.map(d=>daysLeft(d.date));
  const cnt={ok:0,warn:0,soon:0,exp:0};list.forEach(d=>cnt[catOf(d)]++);
  const total=list.length,score=Math.round(cnt.ok/total*100);
  const upcoming=list.filter((d,i)=>ns[i]>=0);
  const nextN=upcoming.length?daysLeft(upcoming[0].date):null;
  const need=cnt.soon+cnt.exp;
  const in90=ns.filter(n=>n>=0&&n<=90).length;
  const live=ns.filter(n=>n>=0);
  const avg=live.length?Math.round(live.reduce((a,b)=>a+b,0)/live.length):0;
  const longest=upcoming.length?upcoming[upcoming.length-1]:null;
  let d=0;const stag=()=>'style="animation-delay:'+(d++*70)+'ms"';

  // 12-month timeline
  const t0=today(),months=[];
  const od=ns.filter(n=>n<0).length;months.push({l:'!',c:od,od:1});
  for(let i=0;i<12;i++){const m=new Date(t0.getFullYear(),t0.getMonth()+i,1);
    months.push({l:m.toLocaleDateString(undefined,{month:'narrow'}),c:list.filter(x=>{const p=parse(x.date);return p.getFullYear()===m.getFullYear()&&p.getMonth()===m.getMonth()&&daysLeft(x.date)>=0}).length,now:i===0})}
  const mx=Math.max(1,...months.map(m=>m.c));
  const later=list.filter(x=>daysLeft(x.date)>=0&&parse(x.date)>=new Date(t0.getFullYear(),t0.getMonth()+12,1)).length;

  const tile=(ic,col,num,label,suffix)=>'<div class="tile" '+stag()+'><div class="ti" style="color:'+col+'">'+svg(ic)+'</div>'
    +(num===null?'<b>—</b>':'<b><span class="num" data-n="'+num+'">'+num+'</span>'+(suffix||'')+'</b>')+'<span>'+label+'</span></div>';

  el.innerHTML=
   '<div class="panel" '+stag()+'><h3>Document health</h3><div class="sub">'+total+' tracked · '+cnt.ok+' in good standing</div>'
   +'<div class="healthrow"><div class="don">'+donut(CAT.map(c=>({v:cnt[c[0]],c:c[2]})),total)+'<div class="c"><div><span class="num" data-n="'+score+'" style="font-size:inherit;color:inherit;margin:0">'+score+'</span><em>%</em></div><span>healthy</span></div></div>'
   +'<div class="legend">'+CAT.map(c=>'<div><i style="background:'+c[2]+'"></i>'+c[1]+'<b>'+cnt[c[0]]+'</b></div>').join('')+'</div></div></div>'
   +'<div class="tiles">'
     +tile('doc','var(--primary)',total,'Documents tracked')
     +tile('warn','var(--bad)',need,'Need action now')
     +tile('clock','var(--warn)',nextN,'Days to next expiry')
     +tile('check','var(--ok)',in90,'Renewals in 90 days')
   +'</div>'
   +'<div class="panel" '+stag()+'><h3>Expiry timeline</h3><div class="sub">Documents expiring each month'+(later?' · +'+later+' later':'')+'</div>'
   +'<div class="chart">'+months.map((m,i)=>'<div class="col'+(m.c?' has':'')+(m.od?' od':'')+(m.now?' now':'')+'"><div class="cnt">'+(m.c||'')+'</div><div class="b2" style="height:'+(m.c?Math.max(14,m.c/mx*100):0)+'%;--d:'+(i*45)+'ms"></div><div class="mo">'+m.l+'</div></div>').join('')+'</div></div>'
   +'<div class="panel" '+stag()+'><h3>Up next</h3><div class="sub">Closest deadlines</div>'
   +list.slice(0,4).map(x=>{const n=daysLeft(x.date),c=catOf(x),ct=catOfDoc(x),col=c==='ok'?'var(--ok)':c==='warn'?'var(--warn)':c==='exp'?'var(--exp)':'var(--bad)';
     return '<div class="urow" data-id="'+x.id+'"><div class="ic" style="color:'+ct[2]+'">'+svg(ct[3])+'</div><div class="info"><div class="nm">'+esc(x.name)+'</div><div class="dt">'+fmt(x.date)+'</div></div><span class="pill" style="color:'+col+'">'+(n<0?overInfo(x.date).n+' '+overInfo(x.date).short:n===0?'Today':n+' days')+'</span></div>'}).join('')+'</div>'
   +'<div class="panel insights" '+stag()+'><h3 style="margin-bottom:6px">Insights</h3>'
   +'<div><span>Average time left</span><b>'+(live.length?avg.toLocaleString()+' days':'—')+'</b></div>'
   +'<div><span>Longest validity</span><b>'+(longest?esc(longest.name)+' · '+daysLeft(longest.date).toLocaleString()+' days':'—')+'</b></div>'
   +'<div><span>Renew within 90 days</span><b>'+in90+(in90===1?' document':' documents')+'</b></div>'
   +'<div><span>Already expired</span><b>'+cnt.exp+'</b></div>'
   +(cnt.exp?'<div><span>Longest overdue</span><b>'+(o=>esc(list[0].name)+' · '+o.n+' '+o.long.replace(' over',''))(overInfo(list[0].date))+'</b></div>':'')+'</div>';
}
$('vDash').onclick=e=>{const r=e.target.closest('.urow');if(r)openSheet(docs.find(d=>d.id===r.dataset.id))};

/* navigation */
let view='dash';
function setView(v){
  view=v;$('vDash').style.display=v==='dash'?'grid':'none';$('vDocs').style.display=v==='docs'?'block':'none';
  $('title').textContent=v==='dash'?'Dashboard':'Documents';
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  scrollTo(0,0);render();
}
$('nav').onclick=e=>{const b=e.target.closest('button');if(b&&b.dataset.v!==view)setView(b.dataset.v)};

/* ripple on tap */
document.addEventListener('pointerdown',e=>{
  const t=e.target.closest('.card,.btn,.chip,.fab,.pal,.seg button,.nav button');if(!t)return;
  const r=t.getBoundingClientRect(),s=Math.max(r.width,r.height)*2.2,x=document.createElement('span');
  x.className='rip';x.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(e.clientX-r.left-s/2)+'px;top:'+(e.clientY-r.top-s/2)+'px';
  t.appendChild(x);setTimeout(()=>x.remove(),650);
});
/* FAB shrinks while scrolling down */
let lastY=0;addEventListener('scroll',()=>{const y=scrollY;$('add').classList.toggle('min',y>lastY&&y>60);lastY=y},{passive:true});

render();setInterval(()=>render(false),60000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
