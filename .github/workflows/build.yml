name: Build APK
on:
  push:
    branches: [main, claude/app-explanation-fmuxk8]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK on the Releases page

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - run: npx cap add android
      - run: node scripts/add-widget.js
      - run: node scripts/add-branding.js
      - name: Signing (fixed key + rising versionCode => installs as an UPDATE, keeps your data)
        run: node scripts/add-signing.js
        env:
          COUNTLY_KEYSTORE_BASE64: ${{ secrets.COUNTLY_KEYSTORE_BASE64 }}
          COUNTLY_KEYSTORE_PASSWORD: ${{ secrets.COUNTLY_KEYSTORE_PASSWORD }}
          COUNTLY_KEY_ALIAS: ${{ secrets.COUNTLY_KEY_ALIAS }}
          COUNTLY_KEY_PASSWORD: ${{ secrets.COUNTLY_KEY_PASSWORD }}
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Countly.apk
      - uses: actions/upload-artifact@v4
        with:
          name: countly-apk
          path: Countly.apk
      - name: Publish to Releases (direct APK download, no zip)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Countly (latest build)
          body: "Download **Countly.apk** below, copy it to your Android phone and install it."
          files: Countly.apk
          make_latest: true
